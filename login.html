<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Iniciar sesión | Hospital Seguro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-card" aria-labelledby="login-title">
            <div class="login-brand">
                <div class="brand-mark" aria-hidden="true">+</div>
                <div>
                    <div class="brand-name">Hospital Seguro</div>
                    <div class="brand-caption">Panel de seguridad y privacidad</div>
                </div>
            </div>
            <div class="login-heading">
                <span class="eyebrow">Acceso seguro</span>
                <h1 id="login-title">Bienvenido</h1>
                <p>Inicia sesión con tus credenciales institucionales para continuar.</p>
            </div>
            {% if error %}
            <div class="login-error" role="alert">{{ error }}</div>
            {% endif %}
            <form action="{{ url_for('login') }}" method="post" class="login-form" id="login-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <label for="username">Nombre de usuario</label>
                <input id="username" name="username" type="text" autocomplete="username"
                       minlength="3" maxlength="100" required autofocus>
                <label for="password">Contraseña</label>
                <div class="password-field">
                    <input id="password" name="password" type="password" autocomplete="current-password"
                           maxlength="128" required>
                    <button class="password-toggle" type="button" id="toggle-password"
                            aria-controls="password" aria-pressed="false">Mostrar</button>
                </div>
                <button class="button primary login-submit" type="submit" id="login-submit">Iniciar sesión</button>
            </form>
            <p class="login-footnote"><span aria-hidden="true">●</span> Tu sesión está protegida por controles de acceso.</p>
        </section>
    </main>
</body>
</html>
